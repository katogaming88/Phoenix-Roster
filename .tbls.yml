# tbls config: generates dbdoc/ from the local Supabase Postgres stack.
# Docs: https://github.com/k1LoW/tbls
# Regenerate with: npm run db:docs (requires `supabase start` running).
# The DSN is the Supabase CLI local-stack default, identical on every dev
# machine and in CI. It is not a secret.
dsn: postgres://postgres:postgres@127.0.0.1:54322/postgres?sslmode=disable
docPath: dbdoc
er:
  format: mermaid
include:
  - public.*
# Trigger order is the one listing that does not come from this setting.
# Since tbls 1.96.0 (2026-09-03, k1LoW/tbls#851) the Postgres driver reads
# triggers ORDER BY oid, which is creation order: stable across separate
# `supabase db reset` runs and across platforms, because the migrations
# create them in the same sequence every time. `tbls diff` compares the live
# schema in that same order without sorting it, so the committed docs carry
# triggers exactly as `tbls doc` writes them and nothing re-sorts them.
#
# History: before 1.96.0 that query had a no-op ORDER BY (tbls#850), the
# order rode the raw catalog state of the current reset, and `tbls diff`
# flaked on multi-trigger tables no migration had touched. On 2026-09-02 a
# sort step (scripts/ci/dbdoc-sort.js) put every trigger listing in name
# order after `tbls doc` to keep the check green; the day 1.96.0 shipped that
# name order failed the check deterministically on five tables, so the step
# and its test were retired and the docs regenerated in tbls' own order.
#
# A trigger-order diff in CI now means the docs were regenerated with an
# older tbls. The schema-docs workflow installs the latest release, so match
# the local exe to it and regenerate.
sort: true
