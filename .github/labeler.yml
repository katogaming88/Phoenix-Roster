# Both admin surfaces: the officer dashboard's Admin tab and the standalone
# site-admin dashboard. admin.html is deliberately absent -- every version
# stamp retags all three HTML files, so listing it here would label every PR.
admin:
  - changed-files:
    - any-glob-to-any-file:
      - js/tabs/tab-admin.js
      - js/admin.js

boe:
  - changed-files:
    - any-glob-to-any-file:
      - js/boe.js
      - js/boe-manage.js
      - js/boe-page.js
      - supabase/functions/boe-webhook/**

# The guild-wide landing page. guild.html is deliberately absent for the same
# reason admin.html is above: every version stamp retags all four HTML files,
# so listing it here would label every release PR.
guild-page:
  - changed-files:
    - any-glob-to-any-file:
      - js/guild.js
      - css/guild.css

database:
  - changed-files:
    - any-glob-to-any-file:
      - supabase/**
      - dbdoc/**

documentation:
  - changed-files:
    - any-glob-to-any-file:
      - docs/**
      - dbdoc/**
      - '*.md'

skip-changelog:
  - changed-files:
    - all-globs-to-all-files:
      - '!js/**'
      - '!gs/**'
      - '!*.html'
