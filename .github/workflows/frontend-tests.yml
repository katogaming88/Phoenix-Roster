name: Frontend tests

# The frontend unit tests load js/ files into a vm sandbox, so like the
# import tests they need no database and get their own cheap job.
on:
  pull_request:
    paths:
      - 'js/**'
      - 'tests/frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-tests.yml'

# A new push to the PR supersedes any still-running check on the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    # Runners are UTC, where the local and UTC calendar dates always agree, so
    # the onboarding-checklist clock tests (#703) would pass either way. Pinning
    # a zone with a real offset is what keeps them able to catch a regression.
    # America/New_York because it is already the project's canonical zone:
    # add_signup_to_roster() computes join_date in it (docs/database-decisions.md,
    # 2026-08-06). The fixed instant in that test file assumes this zone.
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run frontend unit tests
        run: npm run test:frontend
      # Fails a team-wide Supabase read that does not page (#707). Lives here
      # rather than in its own workflow because it runs over js/ and this job
      # already installs and triggers on exactly that.
      - name: Check team-wide reads page
        run: node scripts/ci/team-wide-read-check.js
