name: Schema docs

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/roles.sql'
      - 'supabase/config.toml'
      - 'dbdoc/**'
      - '.tbls.yml'
      - 'docs/rls_policies.*'
      - '.github/workflows/schema-docs.yml'

# A new push to the PR supersedes any still-running check on the old commit,
# so stale runs stop booting a full Postgres stack for a superseded diff.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # tbls cannot introspect RLS policies, so dbdoc/ never covers them.
      # docs/RLS.md is the hand-maintained policy reference; this step keeps
      # it honest by failing any PR that touches policy SQL without touching
      # the reference.
      - name: Require RLS.md update when policies change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          policy_diff=$(git diff "$BASE_SHA" "$HEAD_SHA" -- supabase/migrations/ | grep -iE 'POLICY|ROW LEVEL SECURITY' || true)
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if [ -n "$policy_diff" ] && ! echo "$changed" | grep -qx 'docs/RLS.md'; then
            echo "This PR changes RLS policy SQL in supabase/migrations/ but does not update docs/RLS.md."
            echo "Update the policy matrix in docs/RLS.md in the same PR."
            exit 1
          fi
      # docs/backup-restore.md bakes in schema-tied assumptions (the
      # full-rebuild runbook's four auth.users FKs, sequence-name guidance
      # keyed to specific table names) -- see its "When the schema changes"
      # section, added for #562. This keeps a migration that adds an
      # auth.users FK or renames something from silently going stale there,
      # the same way the RLS.md check above does for policy SQL. It can't
      # catch every schema-tied case in that section (table-count drift,
      # new RLS referencing auth) -- those still rely on review-time judgment.
      - name: Require backup-restore.md review when restore assumptions change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          restore_diff=$(git diff "$BASE_SHA" "$HEAD_SHA" -- supabase/migrations/ | grep -iE '^\+.*(references auth\.users|rename to)' || true)
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if [ -n "$restore_diff" ] && ! echo "$changed" | grep -qx 'docs/backup-restore.md'; then
            echo "This PR adds an auth.users FK or renames a table/column in supabase/migrations/, both schema-tied assumptions baked into docs/backup-restore.md."
            echo "Update docs/backup-restore.md in the same PR (see its 'When the schema changes' section)."
            exit 1
          fi

      # Pinned to the CLI version used to generate dbdoc/ locally. tbls also
      # documents Supabase-internal enums (auth/storage), which come from the
      # bundled Postgres image, so a newer CLI here can fail `tbls diff` on
      # enum changes unrelated to our migrations. Bump this pin and regenerate
      # docs together.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.109.0
      - name: Start local database
        run: |
          supabase db start
          supabase migration up
      # plpgsql_check via the CLI: validates database function bodies
      # (my_team_role, is_site_admin, the updated_at and team-consistency
      # triggers) against the schema the migrations just built. Catches a
      # migration renaming a column that a function still references. Does
      # not cover grants or policies. Baseline was clean at 2.109.0, so any
      # warning fails the build.
      - name: Lint database functions
        run: supabase db lint --local --schema public --level warning --fail-on warning
      - uses: k1LoW/setup-tbls@v1
      # If this fails with ONLY a trigger-order swap on a table your PR
      # didn't touch (e.g. priority_order's two triggers), it's a known
      # upstream tbls flake, not real doc staleness -- see the `sort: true`
      # comment in .tbls.yml for the root cause and tracking issue. Rerun.
      - name: Fail if dbdoc/ is stale
        run: tbls diff
      # Raw policy export; regenerated here and compared against the committed
      # file so it cannot drift. psql is preinstalled on ubuntu runners.
      - name: Fail if docs/rls_policies.csv is stale
        run: |
          psql "postgres://postgres:postgres@127.0.0.1:54322/postgres?sslmode=disable" -f docs/rls_policies.sql
          git diff --exit-code docs/rls_policies.csv
